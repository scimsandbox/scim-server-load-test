name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Validate k6 scripts and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate JSON configuration and shell scripts
        shell: bash
        run: |
          set -euo pipefail

          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(pkg.version || "")) {
              throw new Error(`Invalid semantic version in package.json: ${pkg.version}`);
            }
            const cfg = JSON.parse(fs.readFileSync("config.json", "utf8"));
            if (!cfg.BASE_URL || !Array.isArray(cfg.WORKSPACES) || cfg.WORKSPACES.length === 0) {
              throw new Error("config.json must define BASE_URL and a non-empty WORKSPACES array");
            }
          '

          bash -n scripts/run-tests.sh

      - name: Compile and inspect k6 load-test suite
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" -w /work grafana/k6:2.4.0 inspect main.js >/dev/null
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" -w /work grafana/k6:2.4.0 inspect --env ONLY_SCENARIO=discovery main.js >/dev/null
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" -w /work grafana/k6:2.4.0 inspect --env ONLY_SCENARIO=bulk main.js >/dev/null
